name: Build Windows EXE

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # پایتون ۳.۸: آخرین نسخه‌ای که ویندوز ۸ را پشتیبانی می‌کند
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt pyinstaller==6.6.0

      - name: Build EXEs (Launcher, Host, Viewer)
        working-directory: windows
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm --icon build_assets\remote_desk.ico --name RemoteDesk main.py
          python -m PyInstaller --onefile --windowed --clean --noconfirm --icon build_assets\remote_desk.ico --name RemoteDesk-Host host_app.py
          python -m PyInstaller --onefile --windowed --clean --noconfirm --icon build_assets\remote_desk.ico --name RemoteDesk-Viewer viewer_app.py

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-Windows-EXE
          path: windows/dist/*.exe
          if-no-files-found: error
